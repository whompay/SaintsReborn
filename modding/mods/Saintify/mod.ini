[mod]
name = Saintify
author = tetration
version = 0.1
description = Hitting or shooting an NPC up close while on foot converts them to the Saints: they turn purple on the minimap, can be recruited as followers, and fight for you. Civilians also get a "never cower or flee" override so they stand and fight instead of running(Still not working 100 percent some civilians still run). F3 opens the mod menu: 1 = enable/disable (on by default), 2-5 = debug dumps.
