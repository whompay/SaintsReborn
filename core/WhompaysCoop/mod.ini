[mod]
name = Whompays Co-op
author = whompay
version = 3.0
description = Up to max_players players in one shared world (below: 2-12, 8 by default). New in 3.0: world_mode = shared (every game runs the world around its own player, people and cars change hands in place, the session goes on when its host leaves), the player list (hold Back / Tab), more players dressed on the same memory (the clothing pool). F6 opens the co-op overlay. 1 = host (direct IP), 4 = host online (shows a join code), 2 = join: put the host's IP or join code in join_ip.txt first. 3 = stop, 5 = a copy of you for testing. Every player needs co-op 3.0 of 2026-10-26 or newer (protocol 13: older builds, an earlier 3.0 included, can't join).

[settings]
; Your name in online sessions (empty = your Windows user name).
name = 
port = 27015
; 3.0: the most players a session you host takes, you included (2-12; 8 when the line is missing). A player past it
; is told the session is full. Online, Epic's lobby takes this many. After a host migration the new host's counts.
max_players = 8


avatar = player
; 1 = the other player's body sliders (size, build) are applied to their character (needs own_body)
body = 1
; 1 = the other player gets their own body model (multiplayer's StyleTest_PC_MP slots) so body shapes don't leak between players
own_body = 1
; 3.0, with own_body = 1: how many other players get their own body shape (0-11). Each takes 1.46 MB, set aside at the
; first join (2 = 2.9 MB; 11 = the old 16 MB block); the players after them show your body shape, and the memory goes to
; clothing instead. A body model nobody here is drawn with for 5 s makes room for the next player. 0 = own_body = 0.
own_body_slots = 2
; 3.0, with own_body = 1: with more players than this in the session when the first one joins, no body block at all:
; everyone shows your body shape. 0 = no limit (the default since own_body_slots keeps the block small). (The host of a
; session already over half this size waits 5 s for the players joining together; a small session and a joiner decide
; at once.)
own_body_max = 0
; 3.0: 1 = other players' clothing comes from a shared pool sized to what the players here wear (1 MB blocks, 12 MB of
; memory always kept free): everyone's base layer (hair, shirt, pants, shoes) before anyone's hat (hats and glasses are
; taken off the farthest players for it), far players in their base layer when memory runs short, and an outfit change
; (sent once it held 1.5 s) takes off and puts on only what changed, the rest stays on; 0 = a full set
; (5.9 MB) per other player, as 2.4
clothing_pool = 1
; 3.0, with clothing_pool = 1: 1 = the pool gives memory back to the game (below 8 MB free far players lose items first,
; and after a session what nobody wears goes back; a hat taken off for another player's base layer hands its memory over
; at once); 0 = the pool keeps its memory until the game exits (if you see a crash or broken textures after a session or
; when memory runs low), and nobody's hat is taken off for the others (its memory would stay with it)
clothing_release = 1
; 3.0, with clothing_pool = 1 (test settings): clothing_size_log = N logs the real size of the first N clothing items
; loaded against their category's slot size ("Clothing size" lines); clothing_item_sized = 1 gives co-op's clothing
; buffers the item's size instead of the slot's (2-14 MB more for clothing at 12 players). Keep it 0 until the size
; lines show every item at or under its slot.
clothing_size_log = 0
clothing_item_sized = 0
; 3.0: look_restore = 1 keeps your look (clothes, body sliders, skin and hair colours) in a session: when the game puts
; the save's look back at a mission's end, cancel or restart (a look made in the SR Tweak Menu and not saved went back
; to the default character), co-op puts yours back 2 s later. A save you load is never undone. 0 = the game's look
; from the save. On when the line is missing.
look_restore = 1
; 1 = diagnostic for the body shape: overlay key 5 (player copy) copies your body sliders to the copy and logs what changed
body_test = 1
damage_forward = 0
; 1 = you see the other players' guns, shots, throws, rockets and explosions; 0 = off: their characters are never given a gun
shooting = 1
; 2.4: hit_effects = 1 shows the blood on people hit by other players' bullets (and by the host's people's), as the
; shooter saw it; 0 = no blood sent or shown for other games' hits
hit_effects = 1
; 1 = other players' characters are moved the way the game moves its own player and multiplayer's remote players (a stick input every update), so they walk, run, strafe, back-pedal and aim-walk with their legs; 0 = move orders along their path, as 2.1 (their legs stood still while their player walked with the gun up)
walk = 1
; 1 = notoriety per player: each player has their own stars, every game's police and gangs go after the wanted player, crimes seen in another game count for the player who did them, only the player the cops arrest is busted, and the host's police response (its cars and helicopter, the gangs' cars) comes for the wanted player near the host, whose own police are off while their character stands in the host's game; 0 = off: no stars sync, no crime credit, arrests or police steering across games - the host's stars still rise for the crimes seen in its game, as in 2.0, and a client near the host runs its own police. Either way, hits on your character from the host's people (its police response's units and traffic crews too) come across
police = 1
; 1 = faster memory checks (built in from Co-op Car Guard: under Wine QueryWorkingSetEx is skipped once it never answers, VirtualQuery answers kept 500 ms); 0 = off
memory_speedup = 1
; shared = while you are in the host's area (the host decides: member_join_m / member_leave_m below) you see the host's traffic, made
; once here, moved 20 times a second, faded when it goes (on the host: its traffic goes to the players in its area); own = each game has its own
traffic = shared
; shared = the same for the host's pedestrians; own = each game has its own
peds = shared
; 3.0: area = 2.4's world (the host owns the area around its character, the players in it see the host's world, each game runs its
; own outside it); shared = every game owns the world around its own player and streams each person and car to the players near it
; (people 100 m, cars 150 m), so everyone always sees one world, with no areas. Each game's own spawners stay on and a street two
; players share is split between them: each spawn spot goes to the nearest player's game, the people and traffic counts are shared,
; parked cars stay each game's own until someone touches one (3.0 phase 2b). Any player may start a mission: the session host
; gives one mission at a time to whoever starts it first, and everyone plays that player's mission (another start is refused
; with a notice; the mission ends for everyone if that player leaves). Wanted players near each other share one police response,
; run by the most wanted player's game. Dropped items belong to the game whose person dropped them (3.0 phase 2c). When
; players split up, the people and cars near one of them become that player's game's in place (handover below, 3.0 phase 3).
; Experimental; set it the same on every game. (2.2's world = 0 is gone in 3.0.)
world_mode = area
; 3.0 phase 3, world_mode = shared only: 1 = people and traffic change owner in place when another player's game is nearer
; (they walk and drive on, nothing fades); 0 = they fade when their owner's player leaves and the other game spawns its own.
; On when the line is missing.
handover = 1
; 3.0 phase 4, world_mode = shared only: 1 = the session goes on when the session host leaves or drops out: the player who
; has been in the session longest takes over (the clock, the weather, the mission lock and the relay), everyone keeps their
; slot and links to it again within a few seconds (online, Epic's lobby follows it; a mission the host was playing ends for
; everyone, as when any mission host leaves; direct IP, friends then join the new host at its IP, or IP:port if it shows one).
; 0 = the session ends for everyone when the host leaves, as in world_mode = area, where it always does. The session host's
; setting counts (a client follows it).
host_migration = 1
; 3.0, the session host (protocol 12): 1 = it passes the players' poses on by how far apart they are: every pose within
; 60 m, 10 a second to 170 m, 5 to 500 m, 3 beyond (a death, getting in or out of a car and a teleport at once). With 12
; players spread over the map the session host then sends less than half as much (measured 343 -> 140 KB/s with bots).
; 0 = every pose to everyone. The session host's setting counts.
pose_tiers = 1
; 3.0 (protocol 12): a link's packets that carry only poses and other unreliable messages go at most once per this many
; ms (0-50; 0 = whenever there is something to send). With small poses the packets' own headers were as big as what they
; carried; 10 ms adds at most 10 ms to a pose (the other games' characters are shown ~60 ms behind anyway).
send_pacing_ms = 10
; 2.2, a client: 1 = while you see the host's people, its people models are asked for at level 0 and the people-model slots
; your own game doesn't ask at go there (your homies, mission people, police and gangs keep theirs; the game's own table back when you
; stop seeing them); 0 = 2.1.4: asked for at the top level, the game's slots left as they are.
people_level0 = 1
; 2.4, the host: model_budget = 1 keeps the host's people within what every player in its area can load:
; each player reports its room for the host's people models every 2 s, and while one of them is short and waits for models
; the host's game holds back 1-3 of its own people-model slots (fewer kinds of passers-by on the host, only meanwhile), so
; its people don't stay invisible there. Never while the host's own game waits for a model, nor in a cutscene and the 20 s
; after one. 0 = the host never holds slots back (the joiners still use their own slots in full and decline what can't fit).
; (3.0, world_mode = shared: not used; every game shares its slots out between its own people and the copies it shows.)
model_budget = 1
; 2.2, the host: its upload for the shared area's world stream, in kbit/s, shared by the players in its area: each gets at least 6 KB/s
; (more than the setting in all when many players share it) and at most 24 KB/s, 20 updates a second within that; halved for 2 s while a
; player's link falls behind. (3.0, world_mode = shared: every game's, shared by the players that see something of its world; a
; stream to another client also gets its share of the session host's relay, and each player says how much it takes from each game.)
world_upload_kbps = 1000
; 2.2, the host: a player joins the host's area within member_join_m metres of the host's character for 2 s and leaves it
; past member_leave_m for 5 s (40-400, leave at least join + 20). In the area that player's own traffic, people and police are off and the
; host's are shown; another player's character is kept to member_leave_m + 30 m. Set them the same on every game.
member_join_m = 150
member_leave_m = 200
; 2.2, the host: its game also makes the area's content around each player in it (the parked cars within 80 m, traffic and people near their
; camera), from the area's one street (12 cars, 26 people, 6 parked): 1 = parked cars, 2 = traffic, 4 = people, added (7 = all; 0 = none,
; what the host made is only kept alive near them). The traffic and people passes need traffic = shared / peds = shared on the host.
member_spawns = 7
; 2.2, the host: how much the street grows per player in the area (the game's wanted traffic and people x (1 + member_density x players),
; never past the game's own 12 cars / 26 people, never below what the game wants; a street a mission emptied stays empty); 0 = the host's street is shared as it is
member_density = 1.0
; 2.2: 1 = what the host's world does shows on the players in its area: its people's gunfire (their rounds played on their copies: flash,
; sound, tracers, the trigger held and let go; the hits stay the host's), its cars' brake and reverse lights, horns and steering, burning
; people, exploding props and cars' second explosions, its people's rockets and grenades; and your bullets on the host's cars count there.
; 0 = off on this game, sent and shown alike.
world_actions = 1
; 2.4: name_tags = 1 shows each other player's name over their character, in their map-arrow colour, out to name_tag_m
; metres (10-1000, faded over the last 30 m); hidden with the HUD. 0 = off.
name_tags = 1
name_tag_m = 150
; 3.0: player_list = 1 shows everyone in the session while you hold Back (Select; Tab on the keyboard): their colour, name,
; who hosts the session and the mission, in a car or on foot, how far away, and their ping. In the world only (Back does nothing
; there); in a menu Back works as before. 0 = off (Back always goes to the game).
player_list = 1
; waypoints = 1 shares each player's own map waypoint with the others; it never replaces a player's own
; (another player's shows only while they have none, at most one per player every 3 s). 0 = not shared.
waypoints = 1
; props = 1 shares knocked-over lamp posts, benches and bins: the game that knocked one over decides, the others make it
; loose too. 2.4: on by default. 0 = each game its own.
props = 1
; Experimental, off: stances = 1 shows the host's people's still postures (stand, ready, cover, crouch ready) on the joiner
; while they stand still; walking and running are left to the joiner's copy. Either way the joiner's copies crouch as
; the host's people do, and a copy held in place stands in a posture instead of walking on the spot.
stances = 0
; 3.0, experimental, off: puppets = 1 plays the host's people on the joiner the way the game's own multiplayer shows
; NPCs: a copy on foot has its own AI off (it never shoots, crouches, aims or walks off by itself), its legs play the
; host's person's walk, run, turns and postures as the host's game has them, and its body goes where the host's is.
; In a car, dead, knocked down or in a cutscene a copy is as with 0. 0 = 2.4's copies (their own AI, corrected by co-op).
puppets = 0
; items = 1 shares the host's dropped guns, cash and food, taken once; one gun shows where the host's person fell (the
; host's). 2.4: on by default (the copies are now made as the game makes its own drops). 0 = each game its own drops.
items = 1
; 2.4: corpses = 1 keeps the host's dead people lying on the joiner until the host's game removes the body (before, they
; vanished on the joiner while they still lay on the host). 0 = the joiner's game clears them as its own.
corpses = 1
; 3.0: view_holds = 1 keeps what another player may be looking at from vanishing in front of them: the game that runs a
; person or car holds its removal (up to 20 s) while another player's camera may see it, and on your screen a copy that
; goes out of sight goes at once while a dead body you can see lies on until you look away (30 s at most). Never during a
; cutscene or in the 10 s after a mission starts. 0 = the people and cars of other games fade as soon as their game removes
; them (as before 3.0's fades fix). On when the line is missing.
view_holds = 1
; 3.0: audio_repair = 1 brings the world's sound back when the game left it paused: a joiner's unlock popup (a new
; mission, a reward) after a mission end paused the sound while co-op kept its world running, and the sound only came back
; at the end of the next cutscene. Its pause is handed back when the popup closes, and on every game a sound pause that
; stays on for 5 s with nothing of the game's own holding it (a pause, cutscene, loading screen, video, death, menu) is
; ended (also for 30 s after a session). Co-op's own cutscene end waits (at most 1 s) for the cutscene's start to finish.
; 0 = only logged ("Sound pause count" lines), and the cutscene end at once. On when the line is missing.
audio_repair = 1
; 3.0: climb_sync = 1 shows other players' climbs and vaults as the game plays them: their climb is sent to every game
; and the character there climbs the same ledge itself (or plays their climb's moves on their path where it can't).
; 0 = no climb sent or replayed, their climb's states play on the character as before 3.0. On when the line is missing.
climb_sync = 1
; 3.0 (protocol 13): emote_sets = 1 shows the SR Tweak Menu's emotes that borrow another animation set (most poses, the
; prop emotes: blunt, forty, magazine, many dances and gang signs): the set goes with the emote and the character on the
; other screens borrows it too while it plays, then gets its own back. Also frees the held tracks of file emotes there.
; 0 = only the emotes in the character's own set show, as before. On when the line is missing.
emote_sets = 1
; 3.0 (protocol 13): voice_sync = 1 plays the lines your character says (pain, death, combat taunts and threats, the
; Tweak Menu's Voice Lines, a gang voice from Customize > Voice) on your character on the other screens, from where it
; stands, to players within 170 m (at most 4 lines a second). 0 = none sent or played here (the others' characters stay
; silent, as before). On when the line is missing.
voice_sync = 1
; host = story missions follow the host (the joiner is brought over, and can't start missions); own = each game its own.
; (3.0, world_mode = shared: everyone plays the mission of the player who started it, one at a time: see world_mode.)
missions = host
; 2.4: mission_icons = 1 (with missions = host): in the host's mission the joiner's minimap and pause map show the host's
; mission markers (kill, go-to, get/protect), and the joiner's own copies of them and its green 3D car marker are held
; back. 0 = each game shows its own mission's markers. On the host, 0 sends none (the joiners then keep their own).
mission_icons = 1
; 2.4, experimental, off: mission_cars = 1 (with missions = host, and traffic = shared on the host) shows
; the host's mission vehicles to the joiner and hides the joiner's own copy of each (hidden, not removed: its mission
; script keeps it). Needed on the host and on every joiner in the host's area: while one of them has 0 or an older build,
; the host's mission vehicles stay out of the stream for everyone (once they stream, they go on while a player sits in
; one). 0 = each game shows its own mission vehicles.
mission_cars = 0
; 3.0: player_mission_cars = 1 (with missions = host and traffic = shared): whatever mission_cars says, a mission car of
; the host's that a player gets into shows on the other games from then on to the mission's end, with its passengers
; (Aisha in Vice Kings 2), and each joiner hides its own copy of it (only one within 25 m of where the host's car stood).
; On the host it streams the car, on a joiner it hides the copy. 0 = as 2.4 (the car shows only as the driver's car,
; made again on the joiner, and the joiner's own copy stays).
player_mission_cars = 1
; 3.0: hidden_cars_ghost = 1 takes the cars co-op hides (a joiner's own copy of the host's mission car) and the
; mission vehicles the joiner's copy of the host's mission keeps hidden out of the collisions, so a joiner never drives
; into an invisible car. 0 = hidden cars are left as the game leaves them.
hidden_cars_ghost = 1
; 2.4: in a mission, a joiner farther than this many metres from the host is brought next to the host (checked every
; 10 s; 100-2000). 0 = never by distance (the default: the host's markers show where to go; 2.3.9 used 150). The joiner is
; still brought over at the mission's start and when the mission moves the host.
mission_follow_m = 0
; 2.4: after each of the host's mission cutscenes, a joiner is brought next to the host only when farther than this many
; metres (6-2000)
mission_cutscene_follow_m = 40
; shared = the joiner sees the host's cutscenes too (a host skip skips both); own = only the host sees them
cutscenes = shared
; EXPERIMENTAL, keep at 1: more people models at once (2-4). 3 froze the game when entering the world.
; Both players need the same value. Restart the game after changing it.
people_models = 1
; EXPERIMENTAL, keep at 1: memory for people models, times the normal amount. 2 crashed in the player creator.
people_memory = 1
; How copies of the host's people are made: 0 = scripted (the game leaves them alone), 3 = passers-by (the game removes them on its own).
copy_kind = 0
; 1 = the game may not remove copies of the host's people on its own (stops popping in and out). 0 = allowed.
keep_copies = 1
; 1 = diagnostic: log people left on a car's getting-in/out list who belong to another car ("Car list check:" lines)
debug_cars = 0
; 2.4: 1 = extra 10 s status lines in the co-op log for tracking sync problems (people's legs, flinches, crouching,
; corpses, brass, mission markers and vehicles, name tags). 0 = off.
diagnostics = 0
