[package]
name = "saintsreborn-setup"
version = "2.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Builds and updates Saints Reborn from the player's own copy of Saints Row"
publish = false

[[bin]]
name = "SaintsReborn-Setup"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
anyhow = "1"
eframe = { version = "0.34.2", optional = true }
rfd = { version = "0.17.2", optional = true }
ureq = "2.12"
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
xz2 = { version = "0.1", features = ["static"] }
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_Foundation"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true
opt-level = "s"
